# TRAINER ONLY. Grafana for Day 3, Lab 12, reading from OpenShift monitoring (Thanos Querier).
# Grafana is not part of OpenShift Service Mesh, so we install it separately.
#   oc new-project nb-grafana
#   oc apply -n nb-grafana -f trainer/grafana.yaml       (from this lab folder)
#   oc adm policy add-cluster-role-to-user cluster-monitoring-view -z grafana -n nb-grafana
# Then log in (admin / the password in the Secret), and import the Istio community
# dashboards by ID: 7639 (Mesh), 7636 (Service), 7630 (Workload).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: ChangeMe-Netbanking-2026
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      isDefault: true
      jsonData:
        httpHeaderName1: Authorization
        tlsSkipVerify: true
        timeInterval: 15s
      secureJsonData:
        httpHeaderValue1: "Bearer $__file{/var/run/secrets/kubernetes.io/serviceaccount/token}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      containers:
      - name: grafana
        image: docker.io/grafana/grafana:11.3.0
        envFrom:
        - secretRef:
            name: grafana-admin
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: data
        emptyDir: {}
      - name: datasources
        configMap:
          name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
spec:
  to:
    kind: Service
    name: grafana
  port:
    targetPort: http
  tls:
    termination: edge
