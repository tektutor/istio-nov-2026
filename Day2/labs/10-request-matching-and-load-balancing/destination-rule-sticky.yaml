apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: accounts
spec:
  host: accounts
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpHeaderName: x-customer-tier   # same tier, same pod
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
