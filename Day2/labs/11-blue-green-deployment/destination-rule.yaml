apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: accounts
spec:
  host: accounts            # the Kubernetes Service name
  subsets:
  - name: v1
    labels:
      version: v1           # pods with label version=v1
  - name: v2
    labels:
      version: v2           # pods with label version=v2
