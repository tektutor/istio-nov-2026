apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: accounts
spec:
  hosts:
  - accounts
  http:
  - route:
    - destination:
        host: accounts
    retries:
      attempts: 3                          # up to 3 retries
      perTryTimeout: 2s                    # each try waits 2 s at most
      retryOn: 5xx,connect-failure,reset   # when to retry
