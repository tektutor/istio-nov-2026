apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: accounts
spec:
  hosts:
  - accounts
  http:
  - match:
    - headers:
        x-customer-tier:
          exact: staff
    route:
    - destination:
        host: accounts
        subset: v2
    timeout: 2s
  - route:
    - destination:
        host: accounts
        subset: v1
      weight: 80
    - destination:
        host: accounts
        subset: v2
      weight: 20
    timeout: 2s
    retries:
      attempts: 2
      perTryTimeout: 900ms
      retryOn: 5xx,reset,connect-failure
