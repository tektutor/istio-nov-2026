# A standalone Envoy front proxy for Netbanking, with static configuration.
# It runs WITHOUT a sidecar, so you can compare a hand-written Envoy config
# with the config that istiod generates for the mesh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: front-envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    static_resources:
      listeners:
      - name: listener_http
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              route_config:
                name: netbanking_routes
                virtual_hosts:
                - name: netbanking
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/api/" }
                    route:
                      cluster: web_cluster
                      timeout: 3s
                      retry_policy:
                        retry_on: "5xx,connect-failure"
                        num_retries: 2
                  - match: { prefix: "/" }
                    route: { cluster: web_cluster, timeout: 10s }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: web_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 1s
        load_assignment:
          cluster_name: web_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: web, port_value: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-envoy
  labels:
    app: front-envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-envoy
  template:
    metadata:
      labels:
        app: front-envoy
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: envoy
        image: docker.io/envoyproxy/envoy:v1.36-latest
        # Call envoy directly: the image entrypoint script expects root, OpenShift runs a random user
        command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
        ports:
        - name: http
          containerPort: 8080
        - name: admin
          containerPort: 9901
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: front-envoy
---
apiVersion: v1
kind: Service
metadata:
  name: front-envoy
spec:
  selector:
    app: front-envoy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: admin             # the Envoy admin page; never expose it outside the cluster
    port: 9901
    targetPort: 9901
