# notification sends an SMS for each transfer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-v1
  labels:
    app: notification
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
      version: v1
  template:
    metadata:
      labels:
        app: notification
        version: v1
    spec:
      serviceAccountName: notification
      containers:
      - name: notification
        image: netbanking:latest
        env:
        - name: SERVICE
          value: notification
        - name: VERSION
          value: v1
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification
spec:
  selector:
    app: notification
  ports:
  - name: http
    port: 8080
    targetPort: 8080
