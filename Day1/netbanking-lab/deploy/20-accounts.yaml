# accounts owns the balances. 2 pods, so we can break one of them later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-v1
  labels:
    app: accounts
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accounts
      version: v1
  template:
    metadata:
      labels:
        app: accounts      # the Service selects on this label only
        version: v1        # which release this pod runs
    spec:
      serviceAccountName: accounts
      containers:
      - name: accounts
        image: netbanking:latest
        env:
        - name: SERVICE
          value: accounts
        - name: VERSION
          value: v1
        - name: REDIS_HOST
          value: redis
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: accounts
spec:
  selector:
    app: accounts
  ports:
  - name: http
    port: 8080
    targetPort: 8080
